<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #fbc2eb, #e6dee9);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            text-align: center;
            color: #555;
        }

        /* Efek Kelopak Bunga Jatuh */
        .petal {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 15px 0 15px 0;
            opacity: 0.6;
            animation: fall linear infinite;
            z-index: 0;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { top: 110%; transform: translateX(50px) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(5px);
        }

        /* Tampilan Awal */
        #step1 {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .gift-box:active { transform: scale(0.9); }
        .hint-text { font-size: 16px; font-weight: 700; color: #d81b60; letter-spacing: 0.5px; }

        /* Tampilan Pesan */
        #step2 { display: none; }
        
        .typing-container {
            min-height: 80px;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #444;
            font-weight: 500;
            text-align: left;
        }

        /* Elemen Akhir (Foto & Tombol) */
        #final-elements {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
            display: none;
        }
        #final-elements.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        /* Gaya Polaroid */
        .polaroid {
            background: white;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 20px;
        }
        .polaroid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            background-color: #eee;
        }
        .polaroid-text {
            font-size: 14px;
            color: #d81b60;
            font-weight: 700;
            margin-top: 10px;
            display: block;
        }

        .kafi-text { font-size: 16px; font-weight: 700; color: #d81b60; margin-bottom: 20px; }

        .wa-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #f48fb1;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(244, 143, 177, 0.4);
            transition: 0.3s;
        }
        .wa-btn:hover { background: #d81b60; transform: scale(1.05); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
    </style>
</head>
<body>

    <div id="bg-petals"></div>

    <div class="container">
        <div id="step1">
            <div class="gift-box" onclick="bukaKado()">🎁</div>
            <div class="hint-text">ada sesuatu buat kamu.</div>
        </div>

        <div id="step2">
            <div class="typing-container" id="text-typing"></div>
            
            <div id="final-elements">
                <div class="polaroid">
                    <img src="sasha.jpg" alt="salshabila">
                    <span class="polaroid-text">untuk salshabila</span>
                </div>
                <div class="kafi-text">istirahat bareng kafi ya 🤍</div>
                <a href="https://wa.me/6285794728731?text=aku%20kangen%20kamu%20sayang" class="wa-btn">kalo click ini kamu kangen aku</a>
            </div>
        </div>
    </div>

    <script>
        // Bikin hujan kelopak bunga
        function createPetals() {
            const bg = document.getElementById('bg-petals');
            for(let i = 0; i < 20; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 10 + 10) + 'px';
                petal.style.height = (Math.random() * 10 + 10) + 'px';
                petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                bg.appendChild(petal);
            }
        }

        // Teks yang bakal diketik pelan-pelan
        const pesan = "akhirnya mendarat juga di zona nyaman. hari ini kerasa panjang banget ya? sekarang waktunya lepasin semua capeknya. mandi pakai air hangat, minum yang manis, terus rebahan...";
        let i = 0;
        const speed = 60; // kecepatan ngetik (ms)

        function typeWriter() {
            if (i < pesan.length) {
                document.getElementById("text-typing").innerHTML += pesan.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            } else {
                // Kalau teks udah selesai diketik, munculin foto dan tombol
                setTimeout(() => {
                    const finalElements = document.getElementById('final-elements');
                    finalElements.style.display = 'block';
                    setTimeout(() => finalElements.classList.add('show'), 50);
                }, 500);
            }
        }

        function bukaKado() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            
            if (navigator.vibrate) navigator.vibrate(100);
            
            // Mulai ngetik pas kado dibuka
            setTimeout(typeWriter, 300);
        }

        window.onload = createPetals;
    </script>
</body>
</html>
