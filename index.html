<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#ff7eb6 0%,transparent 25%),
    radial-gradient(circle at bottom right,#ffc2de 0%,transparent 25%),
    linear-gradient(135deg,#130017,#2b0036,#4a005d);
    position:relative;
}

/* intro */
#intro{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#130017,#2b0036,#4a005d);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeOut 2.5s forwards;
    animation-delay:2.5s;
}

#intro h1{
    color:white;
    font-size:75px;
    font-family:'Great Vibes',cursive;
    text-shadow:
    0 0 15px rgba(255,255,255,.8),
    0 0 30px rgba(255,105,180,.9),
    0 0 60px rgba(255,105,180,.6);
    animation:zoomText 2s ease;
}

@keyframes zoomText{
    0%{
        transform:scale(.5);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* stars */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

/* hearts */
.heart{
    position:absolute;
    color:#ff8fc5;
    animation:float 8s linear infinite;
    opacity:.7;
    pointer-events:none;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* card */
.card{
    width:370px;
    padding:42px 30px;
    border-radius:35px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
    0 0 35px rgba(255,105,180,.25),
    0 0 70px rgba(255,105,180,.15);
    text-align:center;
    position:relative;
    overflow:hidden;
    animation:show 1.3s ease;
    z-index:2;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* border glow */
.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:35px;
    padding:2px;
    background:linear-gradient(45deg,#ff5ba8,#ffffff,#ff9bcf,#ff5ba8);
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    animation:rotate 7s linear infinite;
    pointer-events:none;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

.title{
    font-family:'Great Vibes',cursive;
    font-size:54px;
    color:white;
    margin-bottom:8px;
    text-shadow:0 0 18px rgba(255,255,255,.6);
}

.small{
    color:#ffd7ea;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:25px;
}

.message{
    color:white;
    font-size:16px;
    line-height:1.9;
    margin-bottom:28px;
    transition:.3s;
}

.highlight{
    color:#ffaad4;
    font-weight:600;
}

button{
    border:none;
    padding:14px 30px;
    border-radius:40px;
    background:linear-gradient(45deg,#ff5ba8,#ff9ccf);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 10px 25px rgba(255,91,168,.35);
    position:relative;
    z-index:10;
}

button:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 15px 35px rgba(255,91,168,.5);
}

.music{
    position:absolute;
    top:18px;
    right:22px;
    color:white;
    font-size:20px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
}
</style>
</head>
<body>

<!-- intro -->
<div id="intro">
    <h1>i love you mosttttt ❤️</h1>
</div>

<!-- music -->
<audio id="bg-music" autoplay loop>
    <source src="Rio Clappy - Bunga Abadi Official Lyric Video.mp3" type="audio/mp3">
</audio>

<!-- card -->
<div class="card">

    <div class="music">♫</div>

    <div class="title">for you</div>
    <div class="small">made with love</div>

    <div class="message" id="message">
        dari semua orang yang pernah hadir di hidup aku,  
        <span class="highlight">kamu</span> tetap jadi orang paling nyaman buat aku ❤️
    </div>

    <button onclick="changeMessage()">klik ini ✨</button>

</div>

<script>

/* autoplay music */
document.addEventListener("click", () => {
    document.getElementById("bg-music").play();
}, { once:true });

/* text */
const messages = [
`aku sayang banget sama kamu ❤️`,

`aku akan berusaha buat bahagiain kamu setiap hari 🥺`,

`aku akan buktiin ke orang tua kamu kalau aku serius sama kamu.`,

`aku gamau cuma jadi persinggahan, aku mau jadi tempat terakhir kamu 🤍`,

`setiap ada notif dari kamu, mood aku langsung balik lagi ✨`,

`aku cuma mau kamu tetap ada di sini nemenin aku.`,

`kamu itu rumah paling nyaman yang pernah aku temuin ❤️`,

`aku harap kita bisa terus sama-sama sampai lama banget.`,

`kalau dunia lagi jahat sama kamu, sini cerita ke aku ya.`,

`aku bakal usahain jadi orang yang paling bikin kamu nyaman.`
];

function changeMessage(){

    const text = document.getElementById("message");

    text.style.opacity = "0";

    setTimeout(() => {

        const random = Math.floor(Math.random() * messages.length);

        text.innerHTML = messages[random];

        text.style.opacity = "1";

    }, 200);
}

/* whatsapp redirect */
setTimeout(() => {

    window.location.href =
    "https://wa.me/6285794728731?text=lucu%20tidak%20sayang";

}, 20000);

/* hearts */
function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤";

    heart.style.left = Math.random()*100 + "vw";

    heart.style.fontSize = (Math.random()*20 + 15) + "px";

    heart.style.animationDuration = (Math.random()*5 + 5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,250);

/* stars */
for(let i=0;i<120;i++){

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random()*100 + "vw";

    star.style.top = Math.random()*100 + "vh";

    star.style.animationDuration = (Math.random()*3 + 1) + "s";

    document.body.appendChild(star);
}
</script>

</body>
</html>
