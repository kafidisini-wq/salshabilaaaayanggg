<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 400px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 2s ease forwards;
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .wa-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #f8bbd0;
            color: #c2185b;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid #f48fb1;
        }

        .wa-btn:hover {
            background-color: #f48fb1;
            transform: scale(1.05);
            color: #fff;
        }

        .heart {
            color: #d81b60;
            font-size: 30px;
            margin-top: 25px;
            animation: beat 1.5s infinite;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>selamat sampai rumah, salshabila.</h1>
        <p>pasti capek ya di jalan? sekarang istirahat yang cukup, bersihin badan, terus rebahan. jangan lupa makan ya.</p>
        <p>istirahat bareng kafi ya 🤍</p>
        
        <!-- Tombol WhatsApp -->
        <a href="https://wa.me/6285794728731?text=aku%20kangen%20kamu%20sayang" class="wa-btn">kalo click ini kamu kangen aku</a>
        
        <div class="heart">❤</div>
    </div>

</body>
</html>
