<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Only For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#ff6aa9 0%,transparent 25%),
    radial-gradient(circle at bottom right,#ffb6d9 0%,transparent 25%),
    linear-gradient(135deg,#120018,#2c003e,#4a005f);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Bintang */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff7abf;
    font-size:18px;
    animation:float 10s linear infinite;
    opacity:.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* Card */
.card{
    width:370px;
    padding:40px 30px;
    border-radius:35px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
    0 0 30px rgba(255,105,180,.3),
    0 0 60px rgba(255,105,180,.15);
    text-align:center;
    position:relative;
    overflow:hidden;
    animation:show 1.5s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(40px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Glow Border */
.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:35px;
    padding:2px;
    background:linear-gradient(45deg,#ff4fa3,#ffffff,#ff87c5,#ff4fa3);
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    animation:rotate 6s linear infinite;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

.top{
    font-family:'Great Vibes',cursive;
    font-size:52px;
    color:white;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(255,255,255,.6);
}

.subtitle{
    color:#ffd4ea;
    font-size:14px;
    margin-bottom:25px;
    letter-spacing:2px;
}

.message{
    color:white;
    font-size:16px;
    line-height:1.8;
    margin-bottom:30px;
}

.highlight{
    color:#ff9bd0;
    font-weight:600;
}

button{
    border:none;
    padding:14px 32px;
    border-radius:40px;
    background:linear-gradient(45deg,#ff4fa3,#ff86c8);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 10px 25px rgba(255,79,163,.4);
}

button:hover{
    transform:translateY(-4px) scale(1.05);
    box-shadow:0 15px 35px rgba(255,79,163,.6);
}

.fade{
    animation:fade .7s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Music Note */
.music{
    position:absolute;
    top:18px;
    right:20px;
    color:white;
    font-size:20px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}
</style>
</head>
<body>

<div class="card">
    <div class="music">♫</div>

    <div class="top">For You</div>
    <div class="subtitle">ONLY MY FAVORITE PERSON</div>

    <div class="message fade" id="msg">
        Dari semua orang yang pernah aku kenal...  
        <span class="highlight">kamu</span> tetap jadi alasan ternyaman buat aku pulang. ❤️
    </div>

    <button onclick="nextMessage()">Klik Sayang ✨</button>
</div>
