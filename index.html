<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat sasha</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2; /* warna pastel biar adem */
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        #btnKangen {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #ff8fa3;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btnKangen:active {
            transform: scale(0.9);
        }

        .pesan {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dekorasi bunga simpel */
        .flower {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tampilan Awal -->
        <div id="tampilanAwal">
            <button id="btnKangen" onclick="tampilkanPesan()">klik kalau kangen</button>
        </div>

        <!-- Tampilan Setelah Klik -->
        <div id="pesanRahasia" class="pesan">
            <div class="flower">🌸</div>
            <h1>sama dong...</h1>
            <p>ya udah, telepon sekarang ya?</p>
            <p style="font-size: 12px; color: #aaa;">aku tungguin nih.</p>
        </div>
    </div>

    <script>
        function tampilkanPesan() {
            document.getElementById('tampilanAwal').style.display = 'none';
            document.getElementById('pesanRahasia').style.display = 'block';
        }
    </script>
</body>
</html>
