<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>untuk salshabila</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .name { color: #ff4d6d; font-size: 24px; margin-bottom: 50px; opacity: 0; animation: fadeIn 2s 3s forwards; }
        .flower { position: relative; width: 50px; height: 50px; }
        .petal { position: absolute; background: #ff4d6d; width: 35px; height: 70px; border-radius: 50% 50% 10% 10%; transform-origin: bottom; opacity: 0; animation: bloom 3s forwards; }
        @keyframes bloom { to { opacity: 1; transform: scale(1) rotate(var(--r)); } }
        .center { position: absolute; width: 30px; height: 30px; background: #ffb703; border-radius: 50%; top: -15px; left: -15px; z-index: 5; }
        .text { color: white; text-align: center; margin-top: 150px; opacity: 0; animation: fadeIn 2s 4s forwards; line-height: 1.6; padding: 0 30px; font-size: 1rem; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="name">nur salshabila ❤️</div>

    <div class="flower">
        <div class="petal" style="--r:0deg"></div>
        <div class="petal" style="--r:45deg"></div>
        <div class="petal" style="--r:90deg"></div>
        <div class="petal" style="--r:135deg"></div>
        <div class="petal" style="--r:180deg"></div>
        <div class="petal" style="--r:225deg"></div>
        <div class="petal" style="--r:270deg"></div>
        <div class="petal" style="--r:315deg"></div>
        <div class="center"></div>
    </div>

    <div class="text">
        maaf ya kalau kemarin aku besar kepala dan ngeyel banget...<br>
        aku tau aku yang salah. bunga ini mekar khusus buat kamu,<br>
        jangan marah lagi ya? aku kangen.
    </div>

</body>
</html>
