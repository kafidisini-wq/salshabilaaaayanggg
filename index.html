<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat nur salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            min-height: 100vh;
            background: #1a1a2e; /* Warna gelap untuk tahap awal */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            color: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1.5s ease;
        }
        body.light-mode {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        }

        /* --- SEMUA TAHAPAN (PHASES) --- */
        .phase {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        .phase.active { opacity: 1; pointer-events: auto; }

        /* --- TAHAP 1: TRANSFER ENERGI --- */
        #phase1 { color: #fff; }
        .energy-title { font-size: 16px; margin-bottom: 30px; letter-spacing: 1px; color: #e94560; font-weight: 700; text-align: center; }
        
        .battery-box {
            width: 150px; height: 60px;
            border: 3px solid #e94560; border-radius: 10px;
            position: relative; margin-bottom: 15px;
            padding: 3px;
        }
        .battery-box::after {
            content: ''; position: absolute;
            right: -10px; top: 15px;
            width: 7px; height: 24px;
            background: #e94560; border-radius: 0 4px 4px 0;
        }
        .battery-fill {
            width: 0%; height: 100%;
            background: #e94560; border-radius: 5px;
            transition: width 0.1s linear;
        }
        
        .percent-text { font-size: 24px; font-weight: 700; margin-bottom: 40px; color: #fff; }
        
        .fingerprint-btn {
            width: 80px; height: 80px;
            background: rgba(233, 69, 96, 0.2);
            border: 2px dashed #e94560;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; animation: pulse 2s infinite;
            transition: transform 0.2s; touch-action: none; cursor: pointer;
        }
        .finger-hint { margin-top: 15px; font-size: 12px; opacity: 0.7; }

        /* --- TAHAP 2: BUKU HARIAN --- */
        .journal-container {
            background: #fdfbf7;
            width: 85%; max-width: 380px;
            padding: 40px 30px;
            border-radius: 5px 15px 15px 5px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1), 10px 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .journal-container::before {
            content: ''; position: absolute;
            left: 15px; top: 0; bottom: 0; width: 2px;
            background: rgba(216, 27, 96, 0.3);
        }
        .typing-box {
            min-height: 150px; text-align: left;
            font-size: 16px; line-height: 1.8; color: #333;
            font-weight: 500; margin-left: 20px;
        }
        .next-page-btn {
            margin-top: 30px; font-size: 14px; font-weight: 700;
            color: #d81b60; text-align: right; opacity: 0; cursor: pointer;
            transition: opacity 0.5s; animation: bounceX 1.5s infinite;
        }

        /* --- TAHAP 3: BUNGA MEKAR & FOTO --- */
        .flower-container { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        
        /* Foto di tengah (disembunyikan oleh kelopak awalnya) */
        .photo-center {
            position: absolute; width: 130px; height: 130px;
            border-radius: 50%; border: 4px solid #fff;
            object-fit: cover; opacity: 0; transform: scale(0.5);
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 5; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Kelopak Bunga (Petals) */
        .petals { position: absolute; width: 100%; height: 100%; z-index: 10; transition: transform 1s; }
        .petal {
            position: absolute; top: 50%; left: 50%;
            width: 70px; height: 70px;
            background: #ff758c;
            border-radius: 50% 50% 0 50%;
            transform-origin: 0% 0%;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Rotasi awal (Kuncup) */
        .p1 { transform: rotate(0deg) scale(0.6) translate(-5px, -5px); background: #ff7eb3; }
        .p2 { transform: rotate(60deg) scale(0.6) translate(-5px, -5px); background: #ff758c; }
        .p3 { transform: rotate(120deg) scale(0.6) translate(-5px, -5px); background: #ff7eb3; }
        .p4 { transform: rotate(180deg) scale(0.6) translate(-5px, -5px); background: #ff758c; }
        .p5 { transform: rotate(240deg) scale(0.6) translate(-5px, -5px); background: #ff7eb3; }
        .p6 { transform: rotate(300deg) scale(0.6) translate(-5px, -5px); background: #ff758c; }

        /* Stage Mekar */
        .stage1 .petal { transform: scale(0.8) translate(-10px, -10px); }
        .stage2 .petal { transform: scale(0.9) translate(-15px, -15px); }
        .stage3 .p1 { transform: rotate(0deg) scale(1) translate(40px, 40px); opacity: 0.8;}
        .stage3 .p2 { transform: rotate(60deg) scale(1) translate(40px, 40px); opacity: 0.8;}
        .stage3 .p3 { transform: rotate(120deg) scale(1) translate(40px, 40px); opacity: 0.8;}
        .stage3 .p4 { transform: rotate(180deg) scale(1) translate(40px, 40px); opacity: 0.8;}
        .stage3 .p5 { transform: rotate(240deg) scale(1) translate(40px, 40px); opacity: 0.8;}
        .stage3 .p6 { transform: rotate(300deg) scale(1) translate(40px, 40px); opacity: 0.8;}

        .bloom .photo-center { opacity: 1; transform: scale(1); }
        .bloom .petals { z-index: 1; }

        .flower-hint { color: #d81b60; font-weight: 700; margin-top: 30px; font-size: 14px; animation: blink 1.5s infinite; }
        .kafi-sign { font-size: 18px; font-weight: 700; color: #c2185b; opacity: 0; transition: opacity 1s; margin-top: 20px; }

        /* Animations */
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(233, 69, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); } }
        @keyframes bounceX { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="phase1" class="phase active">
        <div class="energy-title">sinkronisasi energi...</div>
        <div class="battery-box"><div class="battery-fill" id="b-fill"></div></div>
        <div class="percent-text" id="b-text">0%</div>
        <div class="fingerprint-btn" id="finger-btn">👆</div>
        <div class="finger-hint">tahan jarimu di sini buat kirim energi</div>
    </div>

    <div id="phase2" class="phase">
        <div class="journal-container">
            <div class="typing-box" id="typing-text"></div>
            <div class="next-page-btn" id="next-btn" onclick="goToPhase3()">buka halaman selanjutnya ➔</div>
        </div>
    </div>

    <div id="phase3" class="phase">
        <div class="flower-container" onclick="tapFlower()">
            <img src="sasha.jpg" class="photo-center" id="sasha-photo" alt="salshabila">
            <div class="petals" id="flower-petals">
                <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
                <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
            </div>
        </div>
        <div class="flower-hint" id="flower-hint">tap bunganya 3 kali buat siram 💧</div>
        <div class="kafi-sign" id="kafi-text">istirahat bareng kafi ya 🤍</div>
    </div>

    <script>
        /* --- LOGIKA TAHAP 1 (BATERAI) --- */
        let charge = 0;
        let chargeInterval;
        const bFill = document.getElementById('b-fill');
        const bText = document.getElementById('b-text');
        const fBtn = document.getElementById('finger-btn');

        function startCharge(e) {
            if(e) e.preventDefault();
            if(charge >= 100) return;
            fBtn.style.transform = 'scale(0.9)';
            if(navigator.vibrate) navigator.vibrate(50);
            
            chargeInterval = setInterval(() => {
                charge += 1.5; 
                if(charge >= 100) { charge = 100; finishCharge(); }
                bFill.style.width = charge + '%';
                bText.innerText = Math.floor(charge) + '%';
            }, 30);
        }

        function stopCharge() {
            clearInterval(chargeInterval);
            fBtn.style.transform = 'scale(1)';
        }

        function finishCharge() {
            clearInterval(chargeInterval);
            bText.innerText = "100% Penuh!";
            bFill.style.background = "#4caf50";
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            setTimeout(() => {
                document.getElementById('phase1').classList.remove('active');
                document.body.classList.add('light-mode'); // Ganti background jadi terang
                
                setTimeout(() => {
                    document.getElementById('phase2').classList.add('active');
                    startTyping();
                }, 1000);
            }, 1000);
        }

        // Support touch (HP) & klik (Mouse)
        fBtn.addEventListener('touchstart', startCharge);
        fBtn.addEventListener('touchend', stopCharge);
        fBtn.addEventListener('mousedown', startCharge);
        fBtn.addEventListener('mouseup', stopCharge);
        fBtn.addEventListener('mouseleave', stopCharge);

        /* --- LOGIKA TAHAP 2 (NGETIK JURNAL) --- */
        const pesan = "akhirnya mendarat juga di zona nyaman. hari ini kerasa panjang banget ya? sekarang waktunya lepasin semua capeknya. bersihin badan, ganti baju yang nyaman, terus rebahan. dan asal kamu tau, aku kangen banget sama kamu.";
        let charIndex = 0;

        function startTyping() {
            if (charIndex < pesan.length) {
                document.getElementById("typing-text").innerHTML += pesan.charAt(charIndex);
                charIndex++;
                setTimeout(startTyping, 50); // Kecepatan ngetik
            } else {
                setTimeout(() => {
                    document.getElementById('next-btn').style.opacity = '1';
                }, 500);
            }
        }

        function goToPhase3() {
            document.getElementById('phase2').classList.remove('active');
            setTimeout(() => {
                document.getElementById('phase3').classList.add('active');
            }, 800);
        }

        /* --- LOGIKA TAHAP 3 (BUNGA MEKAR) --- */
        let flowerTaps = 0;
        const petals = document.getElementById('flower-petals');
        const hint = document.getElementById('flower-hint');

        function tapFlower() {
            if(flowerTaps >= 3) return;
            flowerTaps++;
            if(navigator.vibrate) navigator.vibrate(40);
            
            if(flowerTaps === 1) {
                petals.className = 'petals stage1';
                hint.innerText = "lagi... tap 2 kali lagi 💧";
            } else if(flowerTaps === 2) {
                petals.className = 'petals stage2';
                hint.innerText = "satu kali lagi! ✨";
            } else if(flowerTaps === 3) {
                if(navigator.vibrate) navigator.vibrate([100, 50, 200]);
                petals.className = 'petals stage3 bloom';
                document.getElementById('phase3').classList.add('bloom');
                hint.style.display = 'none';
                
                // Muncilin teks kafi
                setTimeout(() => {
                    document.getElementById('kafi-text').style.opacity = '1';
                }, 1000);
            }
        }
    </script>
</body>
</html>
