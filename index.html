<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sunshine for nur salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #0d1117; /* Warna gelap subuh */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            color: #fff;
            transition: background 0.5s linear;
        }

        /* --- HARDWARE ACCELERATED STARS --- */
        #star-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* --- STAGE MANAGER --- */
        .stage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; z-index: 10;
            transition: opacity 1s ease, transform 1s ease;
        }
        .stage.active { opacity: 1; pointer-events: auto; }

        /* --- TAHAP 1: MATAHARI TERBIT (HOLD INTERACTION) --- */
        .dawn-title {
            font-size: 16px; font-weight: 700; color: #58a6ff;
            letter-spacing: 2px; margin-bottom: 50px; text-align: center;
        }
        
        /* Titik cahaya pusat */
        .core-light {
            width: 20px; height: 20px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px #fff, 0 0 30px #fff;
            position: relative; cursor: pointer;
            touch-action: none; transition: transform 0.2s ease;
        }
        .core-light::after {
            content: ''; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%; background: rgba(255,255,255,0.1);
            animation: pulseGlow 1.5s infinite alternate;
        }
        .core-light:active { transform: scale(0.9); }
        
        .hold-hint {
            margin-top: 30px; font-size: 13px; color: #8b949e;
            animation: blink 1.5s infinite;
        }

        /* --- TAHAP 2: TYPING & REVEAL --- */
        #stage-2 { background: #fff; color: #333; display: none; }
        
        /* Efek silau/flash putih */
        .flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 100; opacity: 0; pointer-events: none;
        }
        
        .sun-reveal-wrapper {
            position: relative; width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 40px; margin-top: -30px;
        }
        
        /* Foto frame matahari */
        .sun-frame {
            width: 150px; height: 150px;
            border-radius: 50%; border: 6px solid #ffca28;
            object-fit: cover;
            box-shadow: 0 0 30px #ffca28, 0 0 60px #ff9800;
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0);
        }
        .stage.active .sun-frame { transform: scale(1); }

        /* Sinar Matahari melingkar */
        .sun-rays {
            position: absolute; width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,202,40,0.3) 0%, rgba(255,152,0,0) 70%);
            animation: raysRotate 8s linear infinite; z-index: 1;
        }

        .typing-box {
            width: 85%; max-width: 380px;
            text-align: left; font-size: 16px; line-height: 1.8;
            color: #555; font-weight: 500; min-height: 120px;
        }
        .typing-box span { color: #f57c00; font-weight: 700; text-shadow: 0 0 5px rgba(245,124,0,0.2); }

        .kafi-sign {
            margin-top: 30px; font-size: 18px; font-weight: 700;
            color: #f57c00; opacity: 0; transition: opacity 1s ease 1s;
        }
        
        /* Particle canvas buat efek sunshine */
        #shine-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* KEYFRAMES */
        @keyframes pulseGlow { 0% { transform: scale(0.9); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes raysRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>
    
    <canvas id="shine-canvas"></canvas>
    
    <div class="flash" id="flash-overlay"></div>

    <div id="stage-1" class="stage active">
        <div class="dawn-title">fajar sedang menunggu...</div>
        <div class="core-light" id="light-btn"></div>
        <div class="hold-hint">tahan jarimu di cahaya buat terbitin matahari</div>
    </div>

    <div id="stage-2" class="stage">
        <div class="sun-reveal-wrapper">
            <div class="sun-rays"></div>
            <img src="sasha.jpg" alt="salshabila" class="sun-frame" id="sasha-photo">
        </div>
        
        <div class="typing-box" id="teks-ngetik"></div>
        <div class="kafi-sign" id="kafi-text">istirahat bareng kafi ya 🤍</div>
    </div>

    <script>
        /* === KANVAS BINTANG & PARTIKEL === */
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        const shineCanvas = document.getElementById('shine-canvas');
        const shineCtx = shineCanvas.getContext('2d');
        
        let w, h; let stars = []; let shinies = [];
        
        function resize() {
            w = starCanvas.width = shineCanvas.width = window.innerWidth;
            h = starCanvas.height = shineCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); resize();
        
        // Init Stars (Tahap 1)
        for(let i=0; i<150; i++) {
            stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.2, alpha: Math.random(), speed: Math.random()*0.02 });
        }
        
        function drawStars() {
            starCtx.clearRect(0,0,w,h);
            starCtx.fillStyle = "#fff";
            stars.forEach(s => {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed *= -1;
                starCtx.globalAlpha = Math.abs(s.alpha);
                starCtx.beginPath(); starCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); starCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Init Shine Particles (Tahap 3)
        function createShinies() {
            for(let i=0; i<50; i++) {
                shinies.push({
                    x: Math.random()*w, y: Math.random()*h,
                    r: Math.random()*2+1, vy: Math.random()*-1-0.5,
                    alpha: Math.random(), color: ['#ffca28', '#fff', '#ffe082'][Math.floor(Math.random()*3)]
                });
            }
        }
        
        function drawShinies() {
            shineCtx.clearRect(0,0,w,h);
            shinies.forEach(s => {
                s.y += s.vy; s.alpha -= 0.005;
                if(s.alpha <= 0) { s.y = h + 10; s.alpha = 1; s.x = Math.random()*w; }
                shineCtx.globalAlpha = s.alpha;
                shineCtx.fillStyle = s.color;
                shineCtx.beginPath(); shineCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); shineCtx.fill();
            });
            if(document.getElementById('stage-2').style.display === 'flex') requestAnimationFrame(drawShinies);
        }

        /* === HARDWARE INTERACTION (HOLD TO SUNRISE) === */
        let riseProgress = 0; // 0 to 100
        let riseInterval;
        const lBtn = document.getElementById('light-btn');
        const bodyHtml = document.body;
        
        // Warna Gradasi Sunrise (RGB)
        // Awal: 13, 17, 23 (Gelap)
        // Tengah: 255, 138, 101 (Oranye)
        // Akhir: 255, 213, 79 (Kuning Sunshine)
        
        function getSunriseColor(progress) {
            let r, g, b;
            if (progress <= 50) {
                // Gelap ke Oranye
                r = 13 + (255 - 13) * (progress / 50);
                g = 17 + (138 - 17) * (progress / 50);
                b = 23 + (101 - 23) * (progress / 50);
            } else {
                // Oranye ke Kuning
                r = 255;
                g = 138 + (213 - 138) * ((progress - 50) / 50);
                b = 101 + (79 - 101) * ((progress - 50) / 50);
            }
            return `rgb(${r}, ${g}, ${b})`;
        }

        function startSunrise(e) {
            if(e) e.preventDefault();
            if(riseProgress >= 100) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            riseInterval = setInterval(() => {
                riseProgress += 1.5; // Kecepatan terbit
                bodyHtml.style.backgroundColor = getSunriseColor(riseProgress);
                
                // Efek partikel makin cepet kedip pas ditahan
                starCanvas.style.opacity = 1 - (riseProgress / 100);
                
                if(riseProgress >= 100) { riseProgress = 100; finishSunrise(); }
            }, 50);
        }

        function stopSunrise() {
            clearInterval(riseInterval);
            // Kalau dilepas sebelum 100%, balik ke gelap pelan-pelan
            if(riseProgress < 100) {
                riseInterval = setInterval(() => {
                    riseProgress -= 3;
                    if(riseProgress <= 0) { riseProgress = 0; clearInterval(riseInterval); }
                    bodyHtml.style.backgroundColor = getSunriseColor(riseProgress);
                    starCanvas.style.opacity = 1 - (riseProgress / 100);
                }, 50);
            }
        }

        function finishSunrise() {
            clearInterval(riseInterval);
            if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            
            // Efek Flash Silau
            const flash = document.getElementById('flash-overlay');
            flash.style.animation = 'flashEffect 1s ease';
            
            setTimeout(() => {
                // Transisi Stage
                document.getElementById('stage-1').style.display = 'none';
                document.getElementById('stage-2').style.display = 'flex';
                starCanvas.style.display = 'none';
                
                // Mulai Tanda Tangan & Partikel
                createShinies();
                drawShinies();
                setTimeout(ngetikTyping, 800);
                
                setTimeout(() => { document.getElementById('stage-2').classList.add('active'); }, 50);
            }, 500); // Pas tengah-tengah flash silau
        }

        lBtn.addEventListener('touchstart', startSunrise);
        lBtn.addEventListener('touchend', stopSunrise);
        lBtn.addEventListener('mousedown', startSunrise);
        lBtn.addEventListener('mouseup', stopSunrise);

        /* === TYPING & FINAL SIGN === */
        const pesan = "akhirnya nyampe rumah juga. istirahat ya, bersihin badan terus rebahan. asal kamu tau, kamu itu <span>sunshine</span> aku.";
        let charIndex = 0;
        const typeContainer = document.getElementById('teks-ngetik');

        function ngetikTyping() {
            if (charIndex < pesan.length) {
                let char = pesan.charAt(charIndex);
                if (pesan.substring(charIndex, charIndex + 6) === "<span>") {
                    typeContainer.innerHTML += "<span>sunshine</span>";
                    charIndex += 15; // Panjang <span>sunshine</span>
                } else {
                    typeContainer.innerHTML += char;
                    charIndex++;
                }
                setTimeout(ngetikTyping, 60); // Kecepatan ngetik
            } else {
                setTimeout(() => {
                    document.getElementById('kafi-text').style.opacity = '1';
                }, 500);
            }
        }
    </script>
</body>
</html>
