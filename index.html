<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>buat salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #050505; /* Hitam elegan pekat */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            color: #fff;
        }

        /* --- KANVAS FISIKA --- */
        #physics-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
        }

        /* --- TEKS INSTRUKSI AWAL --- */
        #hint-text {
            position: absolute; top: 15%; width: 100%; text-align: center;
            font-size: 14px; font-weight: 500; color: #888; letter-spacing: 3px;
            z-index: 2; animation: breathe 2s infinite alternate; pointer-events: none;
        }

        /* --- TAHAP REVEAL (FOTO & PESAN) --- */
        #reveal-stage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; opacity: 0; pointer-events: none;
            transition: opacity 2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #reveal-stage.show { opacity: 1; pointer-events: auto; }

        .photo-frame {
            width: 180px; height: 240px; border-radius: 12px;
            overflow: hidden; position: relative; margin-bottom: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255, 117, 140, 0.15);
            opacity: 0; transform: translateY(30px); transition: all 2s ease 0.5s;
        }
        #reveal-stage.show .photo-frame { opacity: 1; transform: translateY(0); }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9); transition: 10s linear; }
        .photo-frame:hover img { transform: scale(1.05); } /* Efek breathing pelan di foto */

        .message-box {
            width: 85%; max-width: 380px; text-align: center;
        }
        .typing-text {
            min-height: 80px; font-size: 16px; line-height: 1.8;
            color: #ccc; font-weight: 400; text-align: left;
        }
        .typing-text span {
            color: #ff758c; font-weight: 700; text-shadow: 0 0 10px rgba(255, 117, 140, 0.4);
        }

        .kafi-sign {
            margin-top: 25px; font-size: 14px; font-weight: 700;
            color: #888; opacity: 0; transition: opacity 1.5s ease 1s;
        }

        /* --- ANIMASI --- */
        @keyframes breathe { 0% { opacity: 0.3; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes flashOverlay { 0% { background: transparent; } 10% { background: #fff; } 100% { background: transparent; } }
    </style>
</head>
<body>

    <div id="hint-text">tarik cahayanya...</div>
    <canvas id="physics-canvas"></canvas>

    <div id="reveal-stage">
        <div class="photo-frame">
            <img src="sasha.jpg" alt="salshabila">
        </div>
        <div class="message-box">
            <div class="typing-text" id="type-container"></div>
            <div class="kafi-sign" id="kafi-sign">istirahat bareng kafi ya 🤍</div>
        </div>
    </div>

    <script>
        /* ===================================================
           PHYSICS ENGINE & INTERACTION LOGIC (MASTER CLASS)
           =================================================== */
        const canvas = document.getElementById('physics-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); resize();

        // Variabel Orb (Dua Cahaya)
        let orbStatic = { x: w / 2, y: h / 4, radius: 25, color: '#ff7eb3' }; // Orb Kafi (di atas)
        let orbDrag = { x: w / 2, y: h - (h / 4), radius: 25, color: '#66fcf1', isDragging: false }; // Orb Salsha (di bawah)
        
        let particles = [];
        let shockwaves = [];
        let isExploded = false;

        // Bikin jejak partikel pas Orb digerakin
        function createTrail(x, y, color) {
            particles.push({
                x: x + (Math.random() - 0.5) * 10,
                y: y + (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                radius: Math.random() * 3 + 1,
                color: color,
                life: 1
            });
        }

        // Bikin ledakan masif pas bersatu
        function triggerExplosion() {
            isExploded = true;
            document.getElementById('hint-text').style.display = 'none';
            if(navigator.vibrate) navigator.vibrate([100, 50, 200, 50, 300]); // Getar dramatis

            // Bikin Shockwave
            shockwaves.push({ x: orbStatic.x, y: orbStatic.y, radius: 10, life: 1, maxRadius: 300 });

            // Bikin 200 Partikel meledak
            for(let i = 0; i < 200; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 15 + 2;
                particles.push({
                    x: orbStatic.x, y: orbStatic.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 1,
                    color: Math.random() > 0.5 ? '#ff7eb3' : '#66fcf1',
                    life: 1,
                    decay: Math.random() * 0.015 + 0.005
                });
            }

            // Pindah ke Stage Foto setelah jeda sinematik
            setTimeout(() => {
                canvas.style.transition = "opacity 2s";
                canvas.style.opacity = "0";
                document.getElementById('reveal-stage').classList.add('show');
                setTimeout(startTyping, 1500);
            }, 1000);
        }

        // --- RENDER LOOP ---
        function render() {
            // Efek background blur/trail
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, w, h);

            if (!isExploded) {
                // Hitung Jarak antar Orb
                let dx = orbStatic.x - orbDrag.x;
                let dy = orbStatic.y - orbDrag.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                // Tarikan Magnet Otomatis kalau udah deket (kurang dari 150px)
                if (distance < 150 && !orbDrag.isDragging) {
                    orbDrag.x += dx * 0.05;
                    orbDrag.y += dy * 0.05;
                }

                // Cek Tabrakan
                if (distance < orbStatic.radius + orbDrag.radius) {
                    triggerExplosion();
                }

                // Gambar Garis Magnet (Koneksi transparan)
                if (distance < 300) {
                    ctx.beginPath();
                    ctx.moveTo(orbStatic.x, orbStatic.y);
                    ctx.lineTo(orbDrag.x, orbDrag.y);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${1 - (distance / 300)})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Gambar Orb Kafi (Static)
                ctx.beginPath();
                let g1 = ctx.createRadialGradient(orbStatic.x, orbStatic.y, 0, orbStatic.x, orbStatic.y, orbStatic.radius * 2);
                g1.addColorStop(0, '#fff'); g1.addColorStop(0.2, orbStatic.color); g1.addColorStop(1, 'transparent');
                ctx.fillStyle = g1;
                ctx.arc(orbStatic.x, orbStatic.y, orbStatic.radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Gambar Orb Salsha (Drag)
                ctx.beginPath();
                let g2 = ctx.createRadialGradient(orbDrag.x, orbDrag.y, 0, orbDrag.x, orbDrag.y, orbDrag.radius * 2);
                g2.addColorStop(0, '#fff'); g2.addColorStop(0.2, orbDrag.color); g2.addColorStop(1, 'transparent');
                ctx.fillStyle = g2;
                ctx.arc(orbDrag.x, orbDrag.y, orbDrag.radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Tambah trail otomatis buat Static Orb biar kerasa hidup
                if(Math.random() > 0.5) createTrail(orbStatic.x, orbStatic.y, orbStatic.color);
            }

            // Gambar Shockwave
            for(let i = shockwaves.length - 1; i >= 0; i--) {
                let s = shockwaves[i];
                s.radius += 10;
                s.life -= 0.02;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 126, 179, ${s.life})`;
                ctx.lineWidth = 5;
                ctx.stroke();
                if(s.life <= 0) shockwaves.splice(i, 1);
            }

            // Gambar Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if(isExploded) { p.vx *= 0.95; p.vy *= 0.95; } // Friction pas meledak
                p.life -= p.decay || 0.05;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fill();
                ctx.globalAlpha = 1;

                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(render);
        }
        render();

        /* ===================================================
           INTERACTION CONTROLS (TOUCH & MOUSE)
           =================================================== */
        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onDown(e) {
            if(isExploded) return;
            let pos = getPos(e);
            let dx = pos.x - orbDrag.x;
            let dy = pos.y - orbDrag.y;
            if (Math.sqrt(dx * dx + dy * dy) < orbDrag.radius * 3) {
                orbDrag.isDragging = true;
                if(navigator.vibrate) navigator.vibrate(20);
            }
        }

        function onMove(e) {
            if (!orbDrag.isDragging || isExploded) return;
            let pos = getPos(e);
            orbDrag.x = pos.x;
            orbDrag.y = pos.y;
            createTrail(orbDrag.x, orbDrag.y, orbDrag.color); // Bikin trail pas ditarik
        }

        function onUp() { orbDrag.isDragging = false; }

        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        
        canvas.addEventListener('touchstart', onDown, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, {passive: false});
        window.addEventListener('touchend', onUp);

        /* ===================================================
           CINEMATIC TEXT REVEAL
           =================================================== */
        const pesan = "akhirnya nyampe rumah juga. istirahat ya, bersihin badan terus rebahan. sejujurnya, dari tadi aku kangen banget.";
        let charIndex = 0;
        const typeContainer = document.getElementById('type-container');

        function startTyping() {
            if (charIndex < pesan.length) {
                let char = pesan.charAt(charIndex);
                if (pesan.substring(charIndex, charIndex + 6) === "kangen") {
                    typeContainer.innerHTML += "<span>kangen</span>";
                    charIndex += 6;
                } else {
                    typeContainer.innerHTML += char;
                    charIndex++;
                }
                setTimeout(startTyping, 50); // Kecepatan ngetik
            } else {
                setTimeout(() => {
                    document.getElementById('kafi-sign').style.opacity = '1';
                }, 800);
            }
        }
    </script>
</body>
</html>
