<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            text-align: center;
            color: #555;
        }

        .floating-heart {
            position: absolute;
            bottom: -10vh;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            animation: floatUp 5s infinite linear;
            z-index: 0;
        }
        @keyframes floatUp {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 380px;
        }

        #step1 {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
            transition: transform 0.3s;
            user-select: none;
        }
        .gift-box:active { transform: scale(0.9); }
        .hint-text { font-size: 18px; font-weight: 700; color: #ff758c; }

        #step2 { display: none; opacity: 0; }
        #step2.show {
            display: block;
            animation: fadeInPop 0.8s ease forwards;
        }

        .photo-frame {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 4px solid #ff758c;
            overflow: hidden;
            background: #ffe3e8;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo-frame img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none;
        }

        h1 { color: #ff758c; font-size: 22px; margin-bottom: 15px; font-weight: 700; }
        p { font-size: 15px; line-height: 1.6; margin-bottom: 12px; font-weight: 500; }
        .kafi-text { font-size: 16px; font-weight: 700; color: #ff758c; margin-top: 5px; }

        .wa-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 25px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            transition: 0.3s;
            animation: pulse 2s infinite;
        }
        .wa-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 117, 140, 0.6); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        @keyframes fadeInPop {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="bg-hearts"></div>

    <div class="container">
        <div id="step1">
            <div class="gift-box" onclick="bukaKado()">🎁</div>
            <div class="hint-text">ada paket spesial nih. coba tap kotaknya!</div>
        </div>

        <div id="step2">
            <div class="photo-frame">
                <img src="sasha.jpg" id="img-salsha" alt="salshabila">
            </div>

            <h1>selamat sampai rumah, salshabila.</h1>
            <p>pasti capek ya di jalan? sekarang istirahat yang cukup, bersihin badan, terus rebahan. jangan lupa makan ya.</p>
            <div class="kafi-text">istirahat bareng kafi ya 🤍</div>
            
            <a href="https://wa.me/6285794728731?text=aku%20kangen%20kamu%20sayang" class="wa-btn">kalo click ini kamu kangen aku</a>
        </div>
    </div>

    <script>
        function createHearts() {
            const bg = document.getElementById('bg-hearts');
            const colors = ['#fff', '#ff7eb3', '#fbc2eb'];
            for(let i = 0; i < 15; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.className = 'floating-heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                bg.appendChild(heart);
            }
        }

        function bukaKado() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').classList.add('show');
            
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
            
            const img = document.getElementById('img-salsha');
            img.style.display = 'block';
        }

        window.onload = createHearts;
    </script>
</body>
</html>
