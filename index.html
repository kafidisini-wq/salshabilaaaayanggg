<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat salshabila</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            text-align: center;
            color: #444;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Canvas Interaktif di Background */
        #interactive-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffe3e8;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        .loader-heart {
            color: #d81b60;
            font-size: 50px;
            animation: beat 1s infinite alternate;
        }
        .loader-text {
            margin-top: 20px;
            font-weight: 700;
            color: #d81b60;
            letter-spacing: 2px;
            font-size: 14px;
            animation: blink 1.5s infinite;
        }

        /* Main Container (Glassmorphism) */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 420px;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
        }
        .container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Layar PIN */
        #pin-step {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pin-title { font-size: 18px; font-weight: 700; color: #c2185b; margin-bottom: 20px; }
        .pin-input {
            width: 80%;
            padding: 12px;
            border: 2px solid #ff758c;
            border-radius: 15px;
            text-align: center;
            font-size: 18px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: #d81b60;
            outline: none;
            background: rgba(255,255,255,0.7);
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .pin-input:focus { background: #fff; box-shadow: 0 0 10px rgba(255, 117, 140, 0.5); }
        .pin-hint-text {
            color: #d81b60;
            font-size: 13px;
            font-weight: 700;
            margin-top: 15px;
            display: none;
            animation: blink 1s infinite;
        }

        /* Tampilan Awal: Kado */
        #step1 {
            display: none; /* disembunyiin sampai pin bener */
            flex-direction: column;
            align-items: center;
        }
        .gift-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .gift-box {
            font-size: 80px;
            animation: floatGift 2.5s infinite;
            transition: transform 0.3s;
        }
        .gift-wrapper:active .gift-box { transform: scale(0.85); }
        .tap-hint {
            position: absolute;
            bottom: -10px;
            background: #d81b60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: float 2s infinite;
        }
        .intro-text { font-size: 16px; font-weight: 700; color: #c2185b; }

        /* Tampilan Pesan */
        #step2 { display: none; }
        
        .typing-container {
            min-height: 120px;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.7;
            color: #333;
            font-weight: 500;
            text-align: left;
            position: relative;
        }
        .typing-container::after {
            content: '|';
            position: absolute;
            right: -10px;
            bottom: 0;
            animation: blink 0.7s infinite;
            color: #d81b60;
            display: none;
        }
        .typing-container.typing::after { display: inline-block; }

        /* Elemen Final */
        #final-elements {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }
        #final-elements.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        /* Polaroid Polaroid */
        .polaroid {
            background: #fff;
            padding: 12px 12px 35px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: inline-block;
            transform: rotate(-4deg);
            margin-bottom: 25px;
            border-radius: 4px;
            transition: transform 0.4s ease;
        }
        .polaroid:hover { transform: rotate(0deg) scale(1.05); }
        .polaroid img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            background-color: #f0f0f0;
            border-radius: 2px;
        }
        .polaroid-text {
            font-size: 15px;
            color: #d81b60;
            font-weight: 700;
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .kafi-text { 
            font-size: 17px; 
            font-weight: 700; 
            color: #c2185b; 
            margin-bottom: 25px; 
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(255, 117, 140, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            margin-top: 20px;
        }
        .wa-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .wa-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 117, 140, 0.6); }
        .wa-btn:hover::before { left: 100%; }

        /* Keyframes */
        @keyframes beat { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes floatGift {
            0%, 100% { transform: translateX(0) rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(2px) rotate(2deg); }
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-heart">❤</div>
        <div class="loader-text">menyiapkan sesuatu buat salshabila...</div>
    </div>

    <canvas id="interactive-canvas"></canvas>

    <div class="container" id="main-container">
        
        <div id="pin-step">
            <div class="pin-title">masukin pin dulu ya 🔒</div>
            <input type="number" id="input-pin" class="pin-input" placeholder="xxxxxx" inputmode="numeric">
            <button class="wa-btn" onclick="cekPin()">buka</button>
            <div id="pin-hint" class="pin-hint-text">coba tanggal jadian kita</div>
        </div>

        <div id="step1">
            <div class="gift-wrapper" onclick="bukaKado()">
                <div class="gift-box">🎁</div>
                <div class="tap-hint">tap aku</div>
            </div>
            <div class="intro-text">ada paket spesial nih.</div>
        </div>

        <div id="step2">
            <div class="typing-container typing" id="text-typing"></div>
            
            <div id="final-elements">
                <div class="polaroid">
                    <img src="sasha.jpg" alt="salshabila">
                    <span class="polaroid-text">untuk salshabila</span>
                </div>
                <div class="kafi-text">istirahat bareng kafi ya 🤍</div>
                <a href="https://wa.me/6285794728731?text=aku%20kangen%20kamu%20sayang" class="wa-btn">kalo click ini kamu kangen aku</a>
            </div>
        </div>

    </div>

    <script>
        /* === SISTEM PARTIKEL CANVAS (BACKGROUND & EFEK KLIK) === */
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let fireflies = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firefly {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x < 0 || this.x > width) this.speedX *= -1;
                if(this.y < 0 || this.y > height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 10;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * -6 - 2;
                this.gravity = 0.1;
                this.life = 1;
                this.color = ['#ff758c', '#ff7eb3', '#ffffff'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.x += this.speedX;
                this.speedY += this.gravity;
                this.y += this.speedY;
                this.life -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `${this.size}px Arial`;
                ctx.fillStyle = this.color;
                ctx.fillText('❤', this.x, this.y);
                ctx.restore();
            }
        }

        for(let i=0; i<40; i++) fireflies.push(new Firefly());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            fireflies.forEach(f => { f.update(); f.draw(); });
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        function createExplosion(x, y) {
            for(let i=0; i<8; i++) particles.push(new Particle(x, y));
        }
        canvas.addEventListener('click', (e) => createExplosion(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            createExplosion(touch.clientX, touch.clientY);
        });

        /* === LOGIKA WEB (LOADING, PIN, KADO) === */
        const pesan = "akhirnya mendarat juga di zona nyaman. hari ini kerasa panjang banget ya? sekarang waktunya lepasin semua capeknya. mandi pakai air hangat, minum yang manis, terus rebahan... dan asal kamu tau, aku kangen banget sama kamu.";
        let charIndex = 0;
        const typingSpeed = 50; 

        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('main-container').classList.add('show');
                }, 1000);
            }, 2000);
        };

        // Fungsi Cek PIN
        function cekPin() {
            const pinVal = document.getElementById('input-pin').value;
            const inputField = document.getElementById('input-pin');
            const hint = document.getElementById('pin-hint');

            if (pinVal === '18042025') {
                document.getElementById('pin-step').style.display = 'none';
                document.getElementById('step1').style.display = 'flex';
                createExplosion(window.innerWidth/2, window.innerHeight/2);
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                // Kalo salah
                hint.style.display = 'block';
                inputField.style.animation = 'none';
                void inputField.offsetWidth; // trigger reflow
                inputField.style.animation = 'shakeError 0.4s';
                inputField.value = ''; // kosongin input
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]); // getar tanda salah
            }
        }

        // Efek ketik perlahan
        function typeWriter() {
            if (charIndex < pesan.length) {
                document.getElementById("text-typing").innerHTML += pesan.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                document.getElementById("text-typing").classList.remove('typing');
                setTimeout(() => {
                    const finalElements = document.getElementById('final-elements');
                    finalElements.style.display = 'block';
                    void finalElements.offsetWidth; 
                    finalElements.classList.add('show');
                }, 400);
            }
        }

        // Fungsi saat kado ditekan
        function bukaKado() {
            createExplosion(window.innerWidth/2, window.innerHeight/2); 
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
            
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            
            setTimeout(typeWriter, 400);
        }
    </script>
</body>
</html>
